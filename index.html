/* ── RESPONSIVE HOOK ── */
const useIsMobile = (bp = 680) => {
  const [m, setM] = React.useState(() => typeof window !== 'undefined' && window.innerWidth <= bp);
  React.useEffect(() => {
    const mq = window.matchMedia('(max-width: ' + bp + 'px)');
    const on = e => setM(e.matches);
    setM(mq.matches);
    mq.addEventListener('change', on);
    return () => mq.removeEventListener('change', on);
  }, [bp]);
  return m;
};

              <span style={{...snS.label, ...(active ? snS.labelActive : {})}}>{item.label}</span>
            </button>
          );
        })}
      </div>
    </nav>
  );
};

/* ── DEVICE SHOT (upload-ready screenshot frame) ── */
const DeviceShot = ({ kind, filename, aspect }) => {
  const [err, setErr] = React.useState(false);
  React.useEffect(() => { if (err && window.lucide) window.lucide.createIcons(); }, [err]);
  const isPhone = kind === 'phone';
  const isMobile = useIsMobile();
  const frameBase = isPhone ? adS.phoneFrame : adS.tabletFrame;
  const frameMobile = isPhone ? adS.phoneFrameMobile : adS.tabletFrameMobile;
  return (
    <div style={{...frameBase, ...(isMobile ? frameMobile : {})}}>
      {isPhone && <div style={adS.notch}></div>}
      <div style={isPhone ? adS.phoneScreen : {...adS.tabletScreen, ...(aspect ? { aspectRatio: aspect } : {})}}>
        {!err
          ? <img src={filename} alt="" onError={() => setErr(true)} style={adS.shotImg} />
          : <div style={adS.shotPlaceholder}>
              <i data-lucide={isPhone ? 'smartphone' : 'tablet'} style={{ width:'24px', height:'24px', stroke:'#B59C8A', strokeWidth:'1.5', display:'block', margin:'0 auto 10px' }}></i>
              <div style={adS.shotPhLabel}>{isPhone ? 'Phone' : 'Tablet'} screenshot</div>
              <div style={adS.shotPhFile}>{filename}</div>
            </div>}
      </div>
    </div>
  );
};

        Back to Apps

        {app.iconType === 'img'
          ? <div style={{...adS.heroIcon, background:'transparent', overflow:'hidden', padding:0, borderRadius:'22%'}}>
              <img src={app.icon} alt="" style={{ width:'100%', height:'100%', objectFit:'cover', display:'block' }} />
            </div>

              <i data-lucide={app.icon} style={{ width:'36px', height:'36px', stroke:'#EA8724', strokeWidth:'1.5', display:'block' }}></i>
            </div>}
        <div>
          <span style={adS.category}>{app.category}</span>
          <h1 style={{...adS.title, ...(isMobile ? adS.titleMobile : {})}}>{app.title}</h1>
        </div>
      </div>
      <p style={adS.desc}>{app.desc}</p>
      <div style={adS.divider}></div>
      <div style={adS.shotsSection}>
        <h2 style={adS.h2}>Screenshots</h2>

            <>
              <img src={app.shot + '-tablet.png'} alt={app.title + ' tablet screenshot'} style={{...adS.bareShot, ...(isMobile ? adS.bareShotMobile : { width:'520px', maxWidth:'58%' })}} />

            </>
          ) : (
            <>
              <DeviceShot kind="tablet" filename={app.shot + '-tablet.png'} aspect={app.tabletAspect} />
              <DeviceShot kind="phone" filename={app.shot + '-phone.png'} />
            </>
          )}
        </div>
      </div>
      <div style={adS.divider}></div>
      <div style={adS.howto}>
        {app.comingSoon && (
          <div style={adS.soonRow}>
            <span style={adS.soonText}>Available soon for</span>
            <img src="android-logo.svg" alt="Android" style={adS.soonLogo} />
            <img src="apple-logo.svg" alt="Apple" style={adS.soonLogo} />
          </div>
        )}
        {app.note && <p style={adS.noteText}>{app.note}</p>}
        <h2 style={adS.h2}>How to Use</h2>
        <ol style={adS.steps}>
          {app.steps.map((step, i) => (
            <li key={i} style={adS.step}>
              <span style={adS.stepNum}>{i+1}</span>
              <span style={adS.stepText}>{step}</span>
            </li>
          ))}
        </ol>
        <p style={adS.policyNote}>
          Read the <a href={app.shot + '-privacy.html'} style={adS.policyLink}>{app.title} Privacy Policy</a>.
        </p>
      </div>
      <div style={adS.divider}></div>
      <div>
        <h2 style={adS.h2}>{app.formTitle || 'Feedback & Feature Requests'}</h2>
        <p style={adS.feedbackIntro}>Have an idea? Found a bug? I read every message.</p>
        {formState.submitted ? (
          <div style={adS.successMsg}>
            <i data-lucide="check-circle" style={{ width:'20px', height:'20px', stroke:'#3A7D44', strokeWidth:'1.75', display:'block', flexShrink:0 }}></i>
            <span>Thanks! I'll read your message and get back to you if needed.</span>
          </div>
        ) : (
          <form name={'feedback-' + app.shot} method="POST" data-netlify="true" data-netlify-honeypot="bot-field" onSubmit={e => { e.preventDefault(); const fd = new FormData(e.target); fetch('/', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams(fd).toString() }).finally(() => setFormState(s => ({...s, submitted:true}))); }} style={adS.form}>
            <input type="hidden" name="form-name" value={'feedback-' + app.shot} />
            <input type="hidden" name="app" value={app.title} />
            <p className="hp-field" aria-hidden="true"><label>Don't fill this out if you're human: <input name="bot-field" tabIndex={-1} autoComplete="off" /></label></p>
            <div style={{...adS.formRow, ...(isMobile ? adS.formRowMobile : {})}}>
              <div style={adS.field}><label style={adS.label}>Your Name</label><input style={adS.input} type="text" name="name" placeholder="e.g. Alex Johnson" /></div>
              <div style={adS.field}><label style={adS.label}>Email (optional)</label><input style={adS.input} type="email" name="email" placeholder="you@example.com" /></div>
            </div>
            <div style={adS.field}><label style={adS.label}>Your Message</label><textarea style={adS.textarea} name="message" rows={4} placeholder="Tell me what you think, or suggest a new feature..."></textarea></div>
            <button type="submit" style={adS.submitBtn}>Send Feedback</button>
          </form>
        )}
      </div>
    </div>
  );
};

  const update = (k,v) => setForm(s => ({...s, [k]:v}));
  const isMobile = useIsMobile();
  return (
    <div style={{...cfS.wrap, ...(isMobile ? cfS.wrapMobile : {})}}>
      <div style={cfS.header}>

        <h1 style={{...cfS.h1, ...(isMobile ? cfS.h1Mobile : {})}}>Get in Touch</h1>
        <p style={cfS.lead}>Have a question, a bug report, or just want to say hi? I'd love to hear from you.</p>
      </div>
      <div style={{...cfS.layout, ...(isMobile ? cfS.layoutMobile : {})}}>
        <div>
          {form.submitted ? (

              <p style={cfS.successText}>Thanks for reaching out. I read every message and will get back to you soon.</p>

              <input type="hidden" name="form-name" value="contact" />
              <p className="hp-field" aria-hidden="true"><label>Don't fill this out if you're human: <input name="bot-field" tabIndex={-1} autoComplete="off" /></label></p>
              <div style={{...cfS.row, ...(isMobile ? cfS.rowMobile : {})}}>
                <div style={cfS.field}><label style={cfS.label}>Your Name</label><input style={cfS.input} type="text" name="name" placeholder="e.g. Alex Johnson" value={form.name} onChange={e => update('name', e.target.value)} /></div>

/* ── APP ── */
const App = () => {
  const initApp = (() => { try { return new URLSearchParams(window.location.search).get('app'); } catch(e){ return null; } })();
  const initPage = (() => { try { return new URLSearchParams(window.location.search).get('page'); } catch(e){ return null; } })();
  const validInit = initApp ? (Object.keys(APP_DETAILS).find(k => k === initApp || APP_DETAILS[k].slug === initApp.toLowerCase()) || (initApp.toLowerCase() === 'still' ? 'Meditation Habit Builder' : null)) : null;
  const [page, setPage] = React.useState(validInit ? 'appdetail' : (['about','apps','contact'].includes(initPage) ? initPage : 'main'));
  const [detailApp, setDetailApp] = React.useState(validInit || 'Meditation Habit Builder');
  const isMobile = useIsMobile();
  React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
  const syncUrl = (p, appKey) => {
    try {
      const d = APP_DETAILS[appKey];
      const q = p === 'appdetail' ? '?app=' + encodeURIComponent((d && d.slug) || appKey) : (p === 'main' ? '' : '?page=' + p);
      window.history.replaceState(null, '', window.location.pathname + q);
    } catch(e) {}
  };
  React.useEffect(() => { syncUrl(page, detailApp); }, []);
  const navigate = (p, app) => { if (app) setDetailApp(app); setPage(p); syncUrl(p, app || detailApp); window.scrollTo(0,0); const sc = document.getElementById('scrollArea'); if (sc) sc.scrollTop = 0; };
  const renderPage = () => {
    switch(page) {
      case 'main':      return <HeroSection onNavigate={navigate} />;
      case 'about':     return <AboutSection />;
      case 'apps':      return <AppsSection onNavigate={navigate} />;
      case 'appdetail': return <AppDetail appKey={detailApp} onNavigate={navigate} />;
      case 'contact':   return <ContactForm />;
      default:          return <HeroSection onNavigate={navigate} />;
    }
  };
  return (
    <div style={{ display:'flex', flexDirection: isMobile ? 'column' : 'row', height:'100vh', overflow:'hidden', background:'#FAF7F2' }}>
      <SideNav currentPage={page === 'appdetail' ? 'apps' : page} onNavigate={navigate} />
      <main style={{ flex:1, minHeight:0, overflow:'hidden', display:'flex', flexDirection:'column' }}>
        <div id="scrollArea" style={{ flex:1, overflowY:'auto', WebkitOverflowScrolling:'touch', height:'100%' }}>
          {renderPage()}
        </div>
      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
